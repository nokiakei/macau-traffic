  }

  function paintParticles(dt){
    for(var i=0;i<particles.length;i++){
      var p=particles[i], bi=lineBands[p.line]||0, bd=BAND_DEF[bi];
      var pace=Math.max(0.25, bd.sp/50)*0.075;
      p.t=(p.t+pace*dt)%1;
      var arr=ROAD3D[p.line], f=p.t*(p.n-1), i0=Math.floor(f), fr=f-i0;
      var i1=Math.min(i0+1, p.n-1);
      var lng=arr[i0*2]+(arr[i1*2]-arr[i0*2])*fr;
      var lat=arr[i0*2+1]+(arr[i1*2+1]-arr[i0*2+1])*fr;
      p.ent.position=new Cesium.ConstantPositionProperty(
        Cesium.Cartesian3.fromDegrees(lng, lat, 18));
      p.ent.point.color=new Cesium.ColorMaterialProperty(bandColor(bi,1));
    }
  }

  document.getElementById("c-traffic").onclick=function(){
    showTraffic=!showTraffic;
    this.classList.toggle("off", !showTraffic);
    for(var i=0;i<corridorEnts.length;i++) corridorEnts[i].show=showTraffic;
    for(var j=0;j<particles.length;j++) particles[j].ent.show=showTraffic;
  };
  document.getElementById("c-fold").onclick=function(){
    var d=document.getElementById("dock"), c=d.classList.toggle("collapsed");
    this.textContent=c?"＋":"－";
  };
  document.getElementById("c-view45").onclick=fly45;
  document.getElementById("c-locate").onclick=function(){
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos){
      viewer.camera.flyTo({
        destination:Cesium.Cartesian3.fromDegrees(pos.coords.longitude, pos.coords.latitude, 1500),
        orientation:{heading:0, pitch:Cesium.Math.toRadians(-45), roll:0},
        duration:2.0
      });
    }, function(){}, {timeout:20000, maximumAge:0, enableHighAccuracy:true});
  };

  var lastT=performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    var dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
    if(showTraffic && !document.hidden) paintParticles(dt);
  }

  Cesium.createGooglePhotorealistic3DTileset().then(function(tileset){
    viewer.scene.primitives.add(tileset);
    refreshBands(ROAD3D.length);
    buildCorridors();
    buildParticles();
    setInterval(function(){
      refreshBands(ROAD3D.length);
      for(var i=0;i<corridorEnts.length;i++){
        var bi=lineBands[i]||0, pl=corridorEnts[i].polyline;
        pl.material=new Cesium.ColorMaterialProperty(bandColor(bi,1));
        pl.depthFailMaterial=new Cesium.ColorMaterialProperty(bandColor(bi,0.38));
      }
    }, 60000);
    document.getElementById("loading").style.display="none";
    fly45();
    requestAnimationFrame(tick);
  }).catch(function(err){
    probeTiles(function(p){
      var detail=p.ok?"":("\n原因："+(p.reason||p.msg)+(p.ref?"｜Google見到嘅來源："+p.ref:""));
      showErr("3D 圖資載入失敗（"+(err&&err.message?err.message:err)+"）"+detail+"\n請cap圖俾小Nok睇");
    });
  });
}
__loadCesium(0);
</script>
</body>
</html>
