  }

  function bandColor(bi, alpha){
    var c=Cesium.Color.fromCssColorString(BAND_DEF[bi].c);
    return alpha<1?c.withAlpha(alpha):c;
  }

  function buildCorridors(){
    for(var i=0;i<corridorEnts.length;i++) viewer.entities.remove(corridorEnts[i]);
    corridorEnts=[];
    for(var k=0;k<ROAD3D.length;k++){
      var bi=lineBands[k]||0, bh=(typeof ROAD3D_H!=="undefined"?ROAD3D_H[k]:0)||0;
      try{
      var plOpt;
      if(bh>0){
        // 跨海大橋：固定橋面高度，唔用 clampToGround（否則條線跌落海面/穿過橋身）
        var harr=[], rk=ROAD3D[k];
        for(var q=0;q<rk.length;q+=2){ harr.push(rk[q], rk[q+1], bh); }
        plOpt={
          positions:Cesium.Cartesian3.fromDegreesArrayHeights(harr),
          width:4,
          material:new Cesium.ColorMaterialProperty(bandColor(bi,1)),
          depthFailMaterial:new Cesium.ColorMaterialProperty(bandColor(bi,0.38))
        };
      }else{
        plOpt={
          positions:Cesium.Cartesian3.fromDegreesArray(ROAD3D[k]),
          clampToGround:true,
          width:4,
          material:new Cesium.ColorMaterialProperty(bandColor(bi,1)),
          // 樓宇遮擋時用半透明色透出，唔會被大廈食咗
          depthFailMaterial:new Cesium.ColorMaterialProperty(bandColor(bi,0.38))
        };
      }
      corridorEnts.push(viewer.entities.add({polyline:plOpt}));
      }catch(e){ console.warn("corridor skip", k, e&&e.message); }
    }
  }

  // ===== 流動光效：成條路沿行車方向嘅進度條（光→暗移動，取代白點）=====
  var flowEnts=[];
  var flowMat=new Cesium.Material({
    fabric:{
      uniforms:{ u_color:new Cesium.Color(1,1,1,.55), u_speed:9.0, u_repeat:5.0 },
      source:"uniform vec4 u_color;uniform float u_speed;uniform float u_repeat;czm_material czm_getMaterial(czm_materialInput materialInput){czm_material material=czm_getDefaultMaterial(materialInput);float t=fract(materialInput.st.s*u_repeat-czm_frameNumber*u_speed/3600.0);float glow=smoothstep(0.0,0.3,t)*(1.0-smoothstep(0.7,1.0,t));material.diffuse=u_color.rgb;material.alpha=u_color.a*glow;return material;}",
    },
    translucent:true
  });
  function buildFlow(){
    for(var k=0;k<ROAD3D.length;k++){
      var arr=ROAD3D[k], bh=(typeof ROAD3D_H!=="undefined"?ROAD3D_H[k]:0)||0;
      var heights=[];
      for(var q=0;q<arr.length;q+=2) heights.push(arr[q],arr[q+1],bh>0?bh:0.5);
      try{
        flowEnts.push(viewer.entities.add({
          polyline:{
            positions:Cesium.Cartesian3.fromDegreesArrayHeights(heights),
            width:3,
            material:flowMat,
            clampToGround:bh>0?false:true
          }
        }));
      }catch(e){ console.warn("flow skip",k,e&&e.message); }
    }
  }

  document.getElementById("c-traffic").onclick=function(){
    showTraffic=!showTraffic;
    this.classList.toggle("off", !showTraffic);
    for(var i=0;i<corridorEnts.length;i++) corridorEnts[i].show=showTraffic;
    for(var j=0;j<flowEnts.length;j++) flowEnts[j].show=showTraffic;
  };
  document.getElementById("c-fold").onclick=function(){
    var d=document.getElementById("dock"), c=d.classList.toggle("collapsed");
    this.textContent=c?"＋":"－";
  };
  document.getElementById("c-view45").onclick=fly45;
  document.getElementById("c-locate").onclick=function(){
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos){
      viewer.camera.flyTo({
        destination:Cesium.Cartesian3.fromDegrees(pos.coords.longitude, pos.coords.latitude, 1500),
        orientation:{heading:0, pitch:Cesium.Math.toRadians(-45), roll:0},
        duration:2.0
      });
    }, function(){}, {timeout:20000, maximumAge:0, enableHighAccuracy:true});
  };

  var lastT=performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    var dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
    // 流動光效由 shader 自動動畫（czm_frameNumber），唔使逐幀更新
  }

  Cesium.createGooglePhotorealistic3DTileset().then(function(tileset){
    viewer.scene.primitives.add(tileset);
    refreshBands(ROAD3D.length);
    buildCorridors();
    buildFlow();
    buildParticles();
    setInterval(function(){
      refreshBands(ROAD3D.length);
      for(var i=0;i<corridorEnts.length;i++){
        var bi=lineBands[i]||0, pl=corridorEnts[i].polyline;
        pl.material=new Cesium.ColorMaterialProperty(bandColor(bi,1));
        pl.depthFailMaterial=new Cesium.ColorMaterialProperty(bandColor(bi,0.38));
      }
    }, 60000);
    document.getElementById("loading").style.display="none";
    fly45();
    requestAnimationFrame(tick);
  }).catch(function(err){
    probeTiles(function(p){
      if(p.reason==="API_KEY_HTTP_REFERRER_BLOCKED"){
        showErr("3D 圖資載入失敗：Google 擋咗呢個來源（"+(p.ref||"冇送來源")+"）。請去 Google Console → 憑證 → 撳你條 Key → HTTP 參照網址加多一行 https://nokiakei.github.io/*（呢個 domain 得你自己用得到）。改完等 1 分鐘再開。");
      }else{
        showErr("3D 圖資載入失敗（"+(err&&err.message?err.message:err)+"）原因："+(p.reason||p.msg)+"（Google見到嘅來源："+(p.ref||"無")+"）。請cap圖俾小Nok睇。");
      }
    });
  });
}
__loadCesium(0);
</script>
</body>
</html>
