<title>澳門交通情報</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#061018;color:#e8f4fd;font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif}
#map{position:absolute;inset:0}
#flowCanvas{position:absolute;left:0;top:0;pointer-events:none}
#loading{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#061018;color:#7dd3fc;font-size:14px}
#loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid #1e3a4f;border-top-color:#0ea5e9;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#err{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#061018;color:#FF5D73;padding:30px;text-align:center;font-size:14px;line-height:2}
.hud{position:absolute;z-index:20}
#topbar{top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(4,10,16,.9),rgba(4,10,16,0));pointer-events:none}
#topbar>*{pointer-events:auto}
#title{font-size:17px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 1px 8px rgba(14,165,233,.5)}
#livebadge{font-size:11px;font-weight:700;color:#04121c;background:#3DDC97;border-radius:20px;padding:3px 10px;display:flex;align-items:center}
#livebadge .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#04121c;margin-right:5px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
#clock{margin-left:auto;font-size:13px;color:#7dd3fc;font-variant-numeric:tabular-nums}
#langbtn{font-size:12px;color:#7dd3fc;background:rgba(14,165,233,.12);border:1px solid rgba(14,165,233,.35);border-radius:8px;padding:4px 9px;cursor:pointer}
#legend{left:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(4,10,16,.78);border:1px solid rgba(14,165,233,.25);border-radius:10px;padding:8px 11px;font-size:11px;line-height:1.9;color:#9fc3d8;backdrop-filter:blur(6px)}
#legend b{color:#e8f4fd}
#legend .note{font-size:10px;color:#5d7a8f}
#dock{top:calc(64px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:8px}
.chip{font-size:12px;color:#cfe9f7;background:rgba(4,10,16,.82);border:1px solid rgba(14,165,233,.35);border-radius:20px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap;text-align:left}
.chip.off{opacity:.42}
.chip:active{transform:scale(.96)}
#sheet{left:12px;bottom:calc(108px + env(safe-area-inset-bottom));width:280px;max-height:38vh;overflow-y:auto;background:rgba(4,10,16,.86);border:1px solid rgba(14,165,233,.3);border-radius:12px;backdrop-filter:blur(8px);padding:10px 12px}
#sheet h3{font-size:13px;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:6px}
#sheet h3 .pulse-dot{width:8px;height:8px;border-radius:50%;background:#3DDC97;animation:blink 1.6s infinite}
#sheet .row{font-size:12px;color:#b8d6e8;padding:8px 4px;border-top:1px solid rgba(14,165,233,.14);cursor:pointer;line-height:1.5}
#sheet .row:active{background:rgba(14,165,233,.15)}
#sheet .row .d{color:#7d99ad;font-size:11px}
#keybar{top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(92vw,380px);background:rgba(4,10,16,.94);border:1px solid rgba(14,165,233,.4);border-radius:12px;padding:14px;display:none;z-index:30}
#keybar.show{display:block}
#keybar input{width:100%;font-size:13px;padding:9px 10px;border-radius:8px;border:1px solid #1e3a4f;background:#0a1622;color:#e8f4fd;margin:8px 0}
#keybar .btns{display:flex;gap:8px}
#keybar button{flex:1;font-size:13px;padding:8px;border-radius:8px;border:1px solid rgba(14,165,233,.4);background:rgba(14,165,233,.15);color:#cfe9f7;cursor:pointer}
.cam-pop{font-size:13px;line-height:1.7;color:#10202e;min-width:210px;max-width:260px}
.cam-pop img{width:100%;border-radius:6px;margin:6px 0;display:block;background:#0a1622;min-height:60px}
.cam-pop a{color:#0369a1}
@media (max-width:480px){
  #sheet{left:8px;right:8px;width:auto;bottom:calc(92px + env(safe-area-inset-bottom));max-height:30vh}
  #legend{font-size:10px;padding:6px 9px;bottom:calc(8px + env(safe-area-inset-bottom));line-height:1.7}
  #dock{top:auto;bottom:calc(8px + env(safe-area-inset-bottom));right:8px;left:8px;flex-direction:row;overflow-x:auto;justify-content:flex-start;gap:6px}
  #dock .chip{flex:0 0 auto}
  #topbar{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
  #title{font-size:15px}
}
</style>
</head>

  setInterval(function(){ refreshBands(self.lines.length); self.cachedPaths=null; }, 60000);
  var self=this, last=performance.now(), hidden=false;
  document.addEventListener("visibilitychange", function(){ hidden=document.hidden; if(!hidden) last=performance.now(); });
  function frame(now){
    if(!self.getMap()) return;
    var dt=Math.min(0.1,(now-last)/1000); last=now;
    if(!hidden && trafficMode!=="off") self.paint(dt, now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
};
FlowOverlay.prototype.draw = function(){ this.cachedPaths=null; this.paint(0, performance.now()); };
FlowOverlay.prototype.cachePaths = function(){
  var proj=this.getProjection(); if(!proj) return;
  var mapDiv=this.getMap().getDiv(), W=mapDiv.offsetWidth, H=mapDiv.offsetHeight, paths=[];
  for(var i=0;i<this.lines.length;i++){
    var line=this.lines[i], pts=[], x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(var j=0;j<line.coords.length;j++){
      var xy=proj.fromLatLngToDivPixel(new google.maps.LatLng(line.coords[j][1],line.coords[j][0]));
      if(!xy) continue;
      pts.push([xy.x,xy.y]);
      if(xy.x<x0)x0=xy.x; if(xy.y<y0)y0=xy.y; if(xy.x>x1)x1=xy.x; if(xy.y>y1)y1=xy.y;
    }
    paths.push(pts.length>1?{p:pts,vis:!(x1<-60||y1<-60||x0>W+60||y0>H+60)}:null);
  }
  this.cachedPaths=paths;
};
FlowOverlay.prototype.onRemove = function(){ if(this.cv&&this.cv.parentNode) this.cv.parentNode.removeChild(this.cv); this.setMap(null); };
FlowOverlay.prototype.posAt = function(line, t){
  var d = t*line.len, cum=line.cum, lo=0, hi=cum.length-1;
  while(lo<hi){ var mid=(lo+hi)>>1; if(cum[mid]<d) lo=mid+1; else hi=mid; }
  var i=Math.max(1,lo), c0=cum[i-1], c1=cum[i], f=c1>c0?(d-c0)/(c1-c0):0;
  var a=line.coords[i-1], b=line.coords[i];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
};
FlowOverlay.prototype.paint = function(dt, now){
  var cv=this.cv, proj=this.getProjection();
  if(!proj) return;
  var mapDiv = this.getMap().getDiv(), W=mapDiv.offsetWidth, H=mapDiv.offsetHeight;
  var dpr = Math.min(2, window.devicePixelRatio||1);
  if(cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; }
  var ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var i, p, line, pt, xy, bi, bd;
  var sim = trafficMode==="sim";
  if(sim){
    // 走廊底色（仿 HK 紅黃綠）
    if(!this.cachedPaths) this.cachePaths();
    var paths=this.cachedPaths||[];
    ctx.save(); ctx.lineJoin="round"; ctx.lineCap="round";
    for(i=0;i<paths.length;i++){
      var e=paths[i]; if(!e||!e.vis) continue;
      bi=lineBands[i]||0;
      ctx.strokeStyle="rgba(6,16,24,.55)"; ctx.lineWidth=6;
      ctx.beginPath(); ctx.moveTo(e.p[0][0],e.p[0][1]);
      for(var k=1;k<e.p.length;k++) ctx.lineTo(e.p[k][0],e.p[k][1]);
      ctx.stroke();
      ctx.strokeStyle=BAND_DEF[bi].c; ctx.globalAlpha=.5; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(e.p[0][0],e.p[0][1]);
      for(var k2=1;k2<e.p.length;k2++) ctx.lineTo(e.p[k2][0],e.p[k2][1]);
      ctx.stroke(); ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  // 粒子：跟行車方向流動（模擬模式按擁擠配色＋速度）
  for(i=0;i<this.particles.length;i++){
    p=this.particles[i]; line=this.lines[p.line]; bi=lineBands[p.line]||0; bd=BAND_DEF[bi];
    var spd = sim ? bd.sp : 30;
    p.t += (spd/3600)*dt/line.len; if(p.t>1) p.t-=1;
    pt=this.posAt(line,p.t);
    xy=proj.fromLatLngToDivPixel(new google.maps.LatLng(pt[1],pt[0]));
    if(!xy||xy.x<-10||xy.y<-10||xy.x>W+10||xy.y>H+10) continue;
    var col = sim ? bd.c : "#bae6fd";
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=7; ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(xy.x,xy.y,sim?2.4:2.1,0,6.2832); ctx.fill();
    ctx.restore();
  }
  // 工程脈衝環
  var pulses=this.getPulses();
  ctx.save(); ctx.lineWidth=2;
  for(i=0;i<pulses.length;i++){
    xy=proj.fromLatLngToDivPixel(pulses[i]);
    if(!xy||xy.x<-40||xy.y<-40||xy.x>W+40||xy.y>H+40) continue;
    var ph=((now/1800)+i*0.13)%1;
    ctx.strokeStyle="rgba(255,200,87,"+(0.55*(1-ph)).toFixed(3)+")";
    ctx.beginPath(); ctx.arc(xy.x,xy.y,7+ph*26,0,6.2832); ctx.stroke();
  }
  ctx.restore();
};
} // end initFlowOverlayClass

window.__initMap = function(){
  map = new google.maps.Map(document.getElementById("map"), {
    center:{lat:22.1805,lng:113.5605}, zoom:13,
    styles:DARK, disableDefaultUI:true, zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    gestureHandling:"greedy", backgroundColor:"#061018"
  });
  try{ map.setTilt(45); }catch(e){}
  trafficLayer = new google.maps.TrafficLayer();
  applyTrafficMode();
  infoWin = new google.maps.InfoWindow();

  var camIcon = emojiIcon("📷","#0ea5e9");
  Object.keys(CAMS).forEach(function(id){
    var c = CAMS[id];
    var mk = new google.maps.Marker({position:{lat:c.lat,lng:c.lng}, map:map, icon:camIcon, title:c.name});
    mk.addListener("click", function(){ infoWin.setContent(camPopup(id, c.name)); infoWin.open(map, mk); });
    camMarkers.push(mk);
  });
  var workIcon = emojiIcon("🚧","#FFC857");
  var pulsePts = [];
  WORKS.forEach(function(w){
    if(!(w.lat && w.lng)) return;
    var mk = new google.maps.Marker({position:{lat:w.lat,lng:w.lng}, map:map, icon:workIcon, title:w.loc||w.title});
    mk.addListener("click", function(){
      infoWin.setContent('<div class="cam-pop"><b>🚧 '+esc(w.loc||"")+'</b><br>'+esc(w.title||"")+'</div>');
      infoWin.open(map, mk);
    });
    workMarkers.push(mk);
    pulsePts.push(new google.maps.LatLng(w.lat, w.lng));
  });
  // 車流光點 overlay
  try{ initFlowOverlayClass(); flowOverlay = new FlowOverlay(map, buildAnimLines(), function(){ return showWorks ? pulsePts : []; }); flowOverlay.launch(); }catch(e){ flowOverlay=null; }
  buildSheet();

  // 開場巡覽（仿 HK fly-over）
  var tour = [
    {c:{lat:22.1750,lng:113.5650}, z:12},
    {c:{lat:22.1400,lng:113.5850}, z:14},
    {c:{lat:22.1989,lng:113.5437}, z:15},
    {c:{lat:22.1805,lng:113.5605}, z:13}
  ];
  var touring = true, ti = 0;
  map.addListener("dragstart", function(){ touring=false; });
  (function step(){
    if(!touring || ti>=tour.length) return;
    map.panTo(tour[ti].c); map.setZoom(tour[ti].z); ti++;
    setTimeout(step, 2600);
  })();

  google.maps.event.addListenerOnce(map, "tilesloaded", function(){
    document.getElementById("loading").style.display="none";
  });
  setTimeout(function(){ document.getElementById("loading").style.display="none"; }, 25000);
  if(QP.get("selftest")==="1") selftest();
};

function buildSheet(){
  var list = document.getElementById("sheetlist"); list.innerHTML="";
  var items = WORKS.filter(function(w){return w.lat&&w.lng;}).slice(0,40);
  items.forEach(function(w){
    var d = document.createElement("div"); d.className="row";
    d.innerHTML = "🚧 "+esc(w.loc||w.title)+'<br><span class="d">'+esc(w.start||"")+" → "+esc(w.end||"")+"</span>";
    d.onclick = function(){ map.panTo({lat:w.lat,lng:w.lng}); map.setZoom(16); };
    list.appendChild(d);
  });
}

function selftest(){
  var checks = [ !!map, !!trafficLayer, camMarkers.length>=90, workMarkers.length>=100, !!flowOverlay, flowOverlay&&flowOverlay.particles.length>50, lineBands.length>100 ];
  document.title = checks.every(Boolean) ? "SELFTEST PASS ("+camMarkers.length+"c/"+workMarkers.length+"w/"+(flowOverlay?flowOverlay.particles.length:0)+"p)" : "SELFTEST FAIL";
}

/* ===== 載入 Google Maps ===== */
function loadMaps(){
  var s = document.createElement("script");
  var glang = lang==="en" ? "en" : (lang==="zh-Hans" ? "zh-CN" : "zh-TW");
  s.src = "https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(gkey)+"&callback=__initMap&language="+glang+"&v=weekly";
  s.async = true; s.defer = true;
  s.onerror = function(){ showErr(T.errNet); };
  document.head.appendChild(s);
}

/* ===== UI 事件 ===== */
function tick(){ var d=new Date(), p=function(n){return String(n).padStart(2,"0");}; document.getElementById("clock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()); }
setInterval(tick,1000); tick();

document.getElementById("langbtn").onclick = function(){
  lang = lang==="zh-Hant" ? "zh-Hans" : (lang==="zh-Hans" ? "en" : "zh-Hant");
  localStorage.setItem("mct-lang", lang);
  location.reload();
};
function toggleChip(btn, fn){ var b=document.getElementById(btn); b.onclick=function(){ if(!map) return; b.classList.toggle("off"); fn(b.classList.contains("off")); }; }
toggleChip("c-works", function(off){ workMarkers.forEach(function(m){m.setMap(off?null:map);}); });
toggleChip("c-cams", function(off){ camMarkers.forEach(function(m){m.setMap(off?null:map);}); });
document.getElementById("c-traffic").onclick=function(){
  if(!map) return;
  trafficMode=trafficModes[(trafficModes.indexOf(trafficMode)+1)%trafficModes.length];
  applyTrafficMode();
};
document.getElementById("c-sat").onclick = function(){
  if(!map) return;
  satOn=!satOn;
  map.setMapTypeId(satOn ? "satellite" : "roadmap");
  this.classList.toggle("off", !satOn);
  if(satOn){ try{map.setTilt(0);}catch(e){} } else { try{map.setTilt(45);}catch(e){} }
};
document.getElementById("c-key").onclick = function(){
  var kb=document.getElementById("keybar"); kb.classList.toggle("show");
  document.getElementById("keyinput").value = (localStorage.getItem("mct-gkey")||"");
};
document.getElementById("keysave").onclick = function(){
  var v=document.getElementById("keyinput").value.trim();
  if(v) localStorage.setItem("mct-gkey", v); else localStorage.removeItem("mct-gkey");
  location.reload();
};
document.getElementById("keyclear").onclick = function(){ localStorage.removeItem("mct-gkey"); location.reload(); };
document.getElementById("keyclose").onclick = function(){ document.getElementById("keybar").classList.remove("show"); };

applyLang();
loadMaps();
</script>
